# SOLO para probar en tu máquina con Docker Desktop antes de subir nada a Coolify.
# Usa el código de tus carpetas locales (aunque no esté commiteado) en vez de
# construir desde GitHub. El archivo que realmente se sube a Coolify es
# docker-compose.yml (ese sí construye desde los repos remotos).
#
# Uso: desde esta carpeta (API/deploy/), con un archivo ".env" al lado
# (copiá .env.example y completá valores de prueba):
#   docker compose -f docker-compose.local.yml up --build

services:
  api:
    build:
      context: ../../API
      dockerfile: API.Service.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__API_DB: "Server=db;Database=API_DB;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpirationMinutes: "60"
    ports:
      - "5080:8080"
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ../../Web
      dockerfile: Web.UI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: "http://api:8080"
    ports:
      - "5081:8080"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "14330:1433"
    volumes:
      - db_data_local:/var/opt/mssql
    restart: unless-stopped

volumes:
  db_data_local:
